<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の花おみくじ | pretty flower</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #f8f7f4; color: #2c2c2a;
  min-height: 100vh; display: flex;
  align-items: flex-start; justify-content: center;
  padding: 2rem 1rem 4rem;
}
.container { max-width: 400px; width: 100%; }
.header { text-align: center; margin-bottom: 1.5rem; }
.shop-name { font-size: 10px; letter-spacing: .2em; color: #888780; text-transform: uppercase; margin-bottom: 8px; }
h1 { font-size: 22px; font-weight: 400; color: #2c2c2a; margin-bottom: 4px; }
.date-str { font-size: 12px; color: #888780; }
.sekki-bar {
  background: #fff; border: 0.5px solid #d3d1c7;
  border-radius: 10px; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem;
}
.sekki-icon { font-size: 22px; flex-shrink: 0; }
.sekki-name { font-size: 14px; font-weight: 500; color: #2c2c2a; }
.sekki-flowers { font-size: 11px; color: #888780; margin-top: 2px; }
.flower-stage {
  width: 160px; height: 160px; margin: 0 auto 1rem;
  cursor: pointer; position: relative;
}
.flower-stage svg { width: 100%; height: 100%; overflow: visible; }
@keyframes idleFloat {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-5px) rotate(2deg); }
}
@keyframes bloom {
  0%  { transform: scale(0.5) rotate(-15deg); opacity:0.3; }
  65% { transform: scale(1.12) rotate(6deg); opacity:1; }
  100%{ transform: scale(1) rotate(0deg); opacity:1; }
}
.flower-stage.idle svg { animation: idleFloat 3s ease-in-out infinite; }
.flower-stage.blooming svg { animation: bloom 0.75s cubic-bezier(.22,1,.36,1) forwards; }
.hint { text-align: center; font-size: 12px; color: #888780; margin-bottom: 1.5rem; }
.result { display: none; }
.result.show { display: block; animation: fadeUp .5s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.card { background: #fff; border: 0.5px solid #d3d1c7; border-radius: 12px; padding: 1.25rem; margin-bottom: 10px; }
.flower-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.flower-svg-small { width: 44px; height: 44px; flex-shrink: 0; }
.flower-ja { font-size: 18px; font-weight: 500; color: #2c2c2a; }
.flower-en { font-size: 11px; color: #888780; }
.luck-badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 14px; border-radius: 20px; margin-bottom: 10px; }
.daikichi{background:#EAF3DE;color:#3B6D11}
.kichi{background:#E1F5EE;color:#0F6E56}
.chukichi{background:#E6F1FB;color:#185FA5}
.shokichi{background:#FAEEDA;color:#854F0B}
.suekichi{background:#EEEDFE;color:#534AB7}
.msg { font-size: 13px; color: #5f5e5a; line-height: 1.85; margin-bottom: 1rem; }
.advice-box { background: #f8f7f4; border-radius: 8px; padding: 10px 12px; }
.advice-label { font-size: 10px; letter-spacing: .08em; color: #888780; margin-bottom: 4px; }
.advice-text { font-size: 13px; color: #2c2c2a; line-height: 1.75; }
.gift-card { background: #fffdf7; border: 1px solid #c8dba0; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; text-align: center; }
.gift-title { font-size: 13px; font-weight: 500; color: #3B6D11; margin-bottom: 4px; }
.gift-body { font-size: 12px; color: #5f5e5a; line-height: 1.75; }
.pretty-card { background: #fff; border: 0.5px solid #d3d1c7; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; }
.pretty-title { font-size: 12px; font-weight: 500; color: #2c2c2a; margin-bottom: 4px; }
.pretty-body { font-size: 12px; color: #5f5e5a; line-height: 1.75; margin-bottom: 8px; }
.pretty-link { font-size: 11px; color: #5f5e5a; border-bottom: 0.5px solid #b4b2a9; text-decoration: none; }
.pretty-link:hover { color: #2c2c2a; }
.btn-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 1.5rem; }
button { font-size: 13px; padding: 9px 18px; border: 0.5px solid #b4b2a9; background: transparent; border-radius: 8px; cursor: pointer; color: #2c2c2a; font-family: inherit; transition: background .15s; }
button:hover { background: #f1efe8; }
.footer { text-align: center; font-size: 10px; color: #b4b2a9; letter-spacing: .05em; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <p class="shop-name">pretty flower</p>
    <h1>今日の花おみくじ</h1>
    <p class="date-str" id="dateStr"></p>
  </div>
  <div class="sekki-bar">
    <div class="sekki-icon" id="sekkiIcon"></div>
    <div>
      <div class="sekki-name" id="sekkiName"></div>
      <div class="sekki-flowers" id="sekkiFlowers"></div>
    </div>
  </div>
  <div class="flower-stage idle" id="flowerStage" onclick="draw()">
    <svg id="mainSvg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <g id="flowerG"></g>
    </svg>
  </div>
  <p class="hint" id="hint">タップして今日の花を引く</p>
  <div class="result" id="result">
    <div class="card">
      <div class="flower-row">
        <svg class="flower-svg-small" id="rSvgSmall" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"></svg>
        <div>
          <div class="flower-ja" id="rFlower"></div>
          <div class="flower-en" id="rEn"></div>
        </div>
      </div>
      <span class="luck-badge" id="rBadge"></span>
      <p class="msg" id="rMsg"></p>
      <div class="advice-box">
        <div class="advice-label">🌿 花のある暮らし</div>
        <div class="advice-text" id="rAdvice"></div>
      </div>
    </div>
    <div id="giftCard" class="gift-card" style="display:none;">
      <div class="gift-title">🎁 大吉おめでとうございます！</div>
      <div class="gift-body">pretty flower アトリエショップにて<br>お任せお花 1本プレゼント🌸<br><small style="color:#888780;font-size:11px;">この画面をお店でご提示ください</small></div>
    </div>
    <div class="pretty-card">
      <div class="pretty-title">🌸 pretty flower</div>
      <div class="pretty-body" id="rPretty"></div>
      <a class="pretty-link" href="https://pretty-flower.github.io/shop/" target="_blank">アトリエについて →</a>
    </div>
    <div class="btn-row">
      <button onclick="reset()">もう一度引く</button>
      <button id="copyBtn" onclick="copyResult()">結果をコピー</button>
    </div>
  </div>
  <p class="footer">花のある暮らしを、pretty flower と一緒に。</p>
</div>
<script>
// ========== SVG花描画 ==========
function flowerSVG(type,cx,cy,r){
  var h=cx,v=cy,s=r,o='';
  if(type==='rose'){
    o+='<ellipse cx="'+h+'" cy="'+(v+s*.2)+'" rx="'+(s*.4)+'" ry="'+(s*.3)+'" fill="#e8a0a8" opacity=".85"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v+s*.05)+'" rx="'+(s*.32)+'" ry="'+(s*.28)+'" fill="#d4707c" opacity=".9"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.08)+'" rx="'+(s*.23)+'" ry="'+(s*.22)+'" fill="#c85068" opacity=".95"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.18)+'" rx="'+(s*.13)+'" ry="'+(s*.13)+'" fill="#e8b8be"/>';
    o+='<ellipse cx="'+(h-s*.24)+'" cy="'+(v+s*.1)+'" rx="'+(s*.17)+'" ry="'+(s*.27)+'" fill="#e8a0a8" opacity=".8" transform="rotate(-28 '+h+' '+v+')"/>';
    o+='<ellipse cx="'+(h+s*.24)+'" cy="'+(v+s*.1)+'" rx="'+(s*.17)+'" ry="'+(s*.27)+'" fill="#e8a0a8" opacity=".8" transform="rotate(28 '+h+' '+v+')"/>';
  } else if(type==='hydrangea'){
    var pos=[[0,-.3],[.22,-.16],[.28,.08],[.12,.28],[-.12,.28],[-.28,.08],[-.22,-.16],[.1,-.06],[-.1,-.06],[0,.1]];
    pos.forEach(function(p){
      var px=h+p[0]*s,py=v+p[1]*s,sr=s*.14;
      o+='<ellipse cx="'+px+'" cy="'+(py-sr*.7)+'" rx="'+(sr*.55)+'" ry="'+(sr*.75)+'" fill="#9baed4" opacity=".85"/>';
      o+='<ellipse cx="'+px+'" cy="'+(py-sr*.7)+'" rx="'+(sr*.55)+'" ry="'+(sr*.75)+'" fill="#9baed4" opacity=".85" transform="rotate(90 '+px+' '+py+')"/>';
      o+='<circle cx="'+px+'" cy="'+py+'" r="'+(sr*.32)+'" fill="#fff" opacity=".9"/>';
      o+='<circle cx="'+px+'" cy="'+py+'" r="'+(sr*.14)+'" fill="#e8f0f8" opacity=".9"/>';
    });
  } else if(type==='scabiosa'){
    for(var i=0;i<8;i++){var a=i*Math.PI/4,px=h+Math.sin(a)*s*.33,py=v-Math.cos(a)*s*.33;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(s*.1)+'" ry="'+(s*.2)+'" fill="#b8a0d4" opacity=".82" transform="rotate('+(i*45)+' '+h+' '+v+')"/>';}
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.18)+'" fill="#9880c0" opacity=".85"/>';
    for(var j=0;j<9;j++){var a2=j*Math.PI*2/9;o+='<circle cx="'+(h+Math.cos(a2)*s*.1)+'" cy="'+(v+Math.sin(a2)*s*.1)+'" r="'+(s*.04)+'" fill="#fff" opacity=".75"/>';}
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.05)+'" fill="#fff" opacity=".95"/>';
  } else if(type==='ranunculus'){
    [[s*.38,'#f0c0b0',10],[s*.28,'#e8a090',9],[s*.2,'#e09078',8],[s*.12,'#d87060',7]].forEach(function(l){
      for(var i=0;i<l[2];i++){var a=i/l[2]*Math.PI*2,px=h+Math.cos(a)*l[0]*.5,py=v+Math.sin(a)*l[0]*.5;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(l[0]*.38)+'" ry="'+(l[0]*.52)+'" fill="'+l[1]+'" opacity=".72" transform="rotate('+(i*(360/l[2]))+' '+h+' '+v+')"/>';}
    });
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.09)+'" fill="#c05840"/>';
  } else if(type==='mimosa'){
    o+='<line x1="'+h+'" y1="'+(v+s*.42)+'" x2="'+h+'" y2="'+(v-s*.32)+'" stroke="#a8a060" stroke-width="'+(s*.045)+'" stroke-linecap="round"/>';
    [[-1,-.25,-.18,.08],[1,-.25,.18,.08],[0,-.28,0,.08]].forEach(function(b){o+='<line x1="'+h+'" y1="'+(v+b[1]*s)+'" x2="'+(h+b[2]*s)+'" y2="'+(v+b[3]*s)+'" stroke="#b8b070" stroke-width="'+(s*.028)+'" stroke-linecap="round"/>';});
    var bp=[[-.28,.02],[-.22,-.1],[-.32,-.14],[-.18,.1],[-.26,.16],[.28,.02],[.22,-.1],[.32,-.14],[.18,.1],[.26,.16],[0,.22],[-.06,.08],[.06,.08]];
    bp.forEach(function(p){o+='<circle cx="'+(h+p[0]*s)+'" cy="'+(v+p[1]*s)+'" r="'+(s*.067)+'" fill="#f0d020" opacity=".95"/><circle cx="'+(h+p[0]*s-s*.02)+'" cy="'+(v+p[1]*s-s*.02)+'" r="'+(s*.032)+'" fill="#f8e060" opacity=".7"/>';});
  } else if(type==='sunflower'){
    for(var i=0;i<16;i++){var a=i/16*Math.PI*2,px=h+Math.cos(a)*s*.33,py=v+Math.sin(a)*s*.33;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(s*.09)+'" ry="'+(s*.23)+'" fill="#f0c020" opacity=".9" transform="rotate('+(i*22.5)+' '+h+' '+v+')"/>';}
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.23)+'" fill="#6b3a10"/><circle cx="'+h+'" cy="'+v+'" r="'+(s*.18)+'" fill="#7d4818"/>';
    for(var j=0;j<20;j++){var a2=j/20*Math.PI*2;o+='<circle cx="'+(h+Math.cos(a2)*s*.12)+'" cy="'+(v+Math.sin(a2)*s*.12)+'" r="'+(s*.028)+'" fill="#f0d050" opacity=".45"/>';}
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.055)+'" fill="#5a2c08"/>';
  } else if(type==='cosmos'){
    for(var i=0;i<8;i++){var a=i/8*Math.PI*2,px=h+Math.cos(a)*s*.3,py=v+Math.sin(a)*s*.3;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(s*.1)+'" ry="'+(s*.26)+'" fill="#e8a0b8" opacity=".85" transform="rotate('+(i*45)+' '+h+' '+v+')"/>';}
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.13)+'" fill="#f8e040"/><circle cx="'+h+'" cy="'+v+'" r="'+(s*.06)+'" fill="#e8b030"/>';
  } else if(type==='eucalyptus'){
    o+='<line x1="'+h+'" y1="'+(v+s*.42)+'" x2="'+h+'" y2="'+(v-s*.4)+'" stroke="#7a9a78" stroke-width="'+(s*.042)+'" stroke-linecap="round"/>';
    [.32,.2,.08,-.04,-.16,-.28,-.38].forEach(function(py,idx){var side=idx%2===0?1:-1,lx=h+side*s*.2,ly=v+py*s;o+='<line x1="'+h+'" y1="'+ly+'" x2="'+lx+'" y2="'+ly+'" stroke="#7a9a78" stroke-width="'+(s*.022)+'" stroke-linecap="round"/><ellipse cx="'+lx+'" cy="'+ly+'" rx="'+(s*.15)+'" ry="'+(s*.1)+'" fill="#8ab890" opacity=".85" transform="rotate('+(side*12)+' '+lx+' '+ly+')"/>';});
  } else if(type==='lily'){
    o+='<line x1="'+(h-s*.08)+'" y1="'+(v-s*.4)+'" x2="'+(h+s*.12)+'" y2="'+(v+s*.32)+'" stroke="#90b880" stroke-width="'+(s*.04)+'" stroke-linecap="round"/>';
    [[.22,-.3,-22],[.27,-.12,-16],[.24,.08,-10],[.17,.26,-5]].forEach(function(b){var bx=h+b[0]*s,by=v+b[1]*s;o+='<ellipse cx="'+bx+'" cy="'+(by+s*.09)+'" rx="'+(s*.1)+'" ry="'+(s*.15)+'" fill="#f8f8f8" opacity=".95" transform="rotate('+b[2]+' '+bx+' '+by+')"/><circle cx="'+bx+'" cy="'+(by+s*.15)+'" r="'+(s*.04)+'" fill="#f0f8e8" opacity=".7"/>';});
    o+='<ellipse cx="'+(h-s*.15)+'" cy="'+(v+s*.12)+'" rx="'+(s*.1)+'" ry="'+(s*.34)+'" fill="#78b068" opacity=".65" transform="rotate(-18 '+(h-s*.15)+' '+(v+s*.12)+')"/>';
  } else if(type==='dahlia'){
    [[s*.44,'#d080a0',14],[s*.32,'#c06090',10],[s*.2,'#b04878',7]].forEach(function(l,li){
      for(var i=0;i<l[2];i++){var a=i/l[2]*Math.PI*2+li*.2,px=h+Math.cos(a)*l[0]*.5,py=v+Math.sin(a)*l[0]*.5;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(l[0]*.28)+'" ry="'+(l[0]*.52)+'" fill="'+l[1]+'" opacity=".82" transform="rotate('+(i*(360/l[2])+li*15)+' '+h+' '+v+')"/>';}
    });
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.08)+'" fill="#f8e0f0"/>';
  } else if(type==='sakura'){
    // 桜：5枚花びら（先端がハート型にへこんでいる）
    for(var i=0;i<5;i++){
      var a=i/5*Math.PI*2-Math.PI/2;
      var px=h+Math.cos(a)*s*.28,py=v+Math.sin(a)*s*.28;
      o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(s*.16)+'" ry="'+(s*.22)+'" fill="#f8c8d0" opacity=".9" transform="rotate('+(i*72)+' '+h+' '+v+')"/>';
    }
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.12)+'" fill="#fff0f4"/>';
    for(var j=0;j<8;j++){var a2=j/8*Math.PI*2;o+='<line x1="'+h+'" y1="'+v+'" x2="'+(h+Math.cos(a2)*s*.1)+'" y2="'+(v+Math.sin(a2)*s*.1)+'" stroke="#e8a0b0" stroke-width="'+(s*.02)+'" stroke-linecap="round"/><circle cx="'+(h+Math.cos(a2)*s*.1)+'" cy="'+(v+Math.sin(a2)*s*.1)+'" r="'+(s*.025)+'" fill="#f0c0a0"/>';}
  } else if(type==='tulip'){
    // チューリップ：丸みのあるカップ形
    o+='<line x1="'+h+'" y1="'+(v+s*.45)+'" x2="'+h+'" y2="'+(v+s*.05)+'" stroke="#6a9a50" stroke-width="'+(s*.06)+'" stroke-linecap="round"/>';
    o+='<ellipse cx="'+(h-s*.15)+'" cy="'+(v+s*.25)+'" rx="'+(s*.08)+'" ry="'+(s*.18)+'" fill="#6a9a50" opacity=".7" transform="rotate(-30 '+(h-s*.15)+' '+(v+s*.25)+')"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.1)+'" rx="'+(s*.2)+'" ry="'+(s*.32)+'" fill="#e05070" opacity=".9"/>';
    o+='<ellipse cx="'+(h-s*.18)+'" cy="'+(v-s*.05)+'" rx="'+(s*.14)+'" ry="'+(s*.3)+'" fill="#d04060" opacity=".85" transform="rotate(-12 '+(h-s*.18)+' '+(v-s*.05)+')"/>';
    o+='<ellipse cx="'+(h+s*.18)+'" cy="'+(v-s*.05)+'" rx="'+(s*.14)+'" ry="'+(s*.3)+'" fill="#d04060" opacity=".85" transform="rotate(12 '+(h+s*.18)+' '+(v-s*.05)+')"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.12)+'" rx="'+(s*.08)+'" ry="'+(s*.18)+'" fill="#f0a0b0" opacity=".6"/>';
  } else if(type==='sweetpea'){
    // スイートピー：ひらひらした蝶のような花びら
    o+='<line x1="'+h+'" y1="'+(v+s*.42)+'" x2="'+h+'" y2="'+(v-s*.1)+'" stroke="#8ab870" stroke-width="'+(s*.035)+'" stroke-linecap="round"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.22)+'" rx="'+(s*.28)+'" ry="'+(s*.2)+'" fill="#e0a8d8" opacity=".85"/>';
    o+='<ellipse cx="'+(h-s*.15)+'" cy="'+(v-s*.05)+'" rx="'+(s*.2)+'" ry="'+(s*.28)+'" fill="#d088c8" opacity=".8" transform="rotate(-15 '+(h-s*.15)+' '+(v-s*.05)+')"/>';
    o+='<ellipse cx="'+(h+s*.15)+'" cy="'+(v-s*.05)+'" rx="'+(s*.2)+'" ry="'+(s*.28)+'" fill="#d088c8" opacity=".8" transform="rotate(15 '+(h+s*.15)+' '+(v-s*.05)+')"/>';
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.28)+'" rx="'+(s*.12)+'" ry="'+(s*.16)+'" fill="#f0c0e8" opacity=".9"/>';
  } else if(type==='peony'){
    // 芍薬：ふんわり大きな球形花
    [[s*.42,'#f0b0c0',12],[s*.3,'#e890a8',10],[s*.2,'#d87090',8],[s*.1,'#f0d0dc',6]].forEach(function(l){
      for(var i=0;i<l[2];i++){var a=i/l[2]*Math.PI*2,px=h+Math.cos(a)*l[0]*.45,py=v+Math.sin(a)*l[0]*.45;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(l[0]*.4)+'" ry="'+(l[0]*.5)+'" fill="'+l[1]+'" opacity=".75" transform="rotate('+(i*(360/l[2]))+' '+h+' '+v+')"/>';}
    });
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.08)+'" fill="#fce8ee"/>';
  } else if(type==='iris'){
    // アイリス：立ち上がる花びら
    o+='<line x1="'+h+'" y1="'+(v+s*.45)+'" x2="'+h+'" y2="'+(v-s*.1)+'" stroke="#6a9060" stroke-width="'+(s*.05)+'" stroke-linecap="round"/>';
    // 上の花びら3枚
    [[-30,0],[0,-10],[30,0]].forEach(function(b){o+='<ellipse cx="'+h+'" cy="'+(v-s*.28)+'" rx="'+(s*.14)+'" ry="'+(s*.3)+'" fill="#7068c8" opacity=".85" transform="rotate('+b[0]+' '+h+' '+(v-s*.05)+')"/>';});
    // 下に垂れる花びら3枚
    [[-35,0],[0,5],[35,0]].forEach(function(b){o+='<ellipse cx="'+h+'" cy="'+(v+s*.1)+'" rx="'+(s*.14)+'" ry="'+(s*.28)+'" fill="#9088e0" opacity=".75" transform="rotate('+b[0]+' '+h+' '+v+')"/>';});
    o+='<ellipse cx="'+h+'" cy="'+(v-s*.1)+'" rx="'+(s*.06)+'" ry="'+(s*.1)+'" fill="#f8f060" opacity=".9"/>';
  } else if(type==='chrysanthemum'){
    // 菊：細い花びらが放射状に
    for(var i=0;i<24;i++){var a=i/24*Math.PI*2,px=h+Math.cos(a)*s*.3,py=v+Math.sin(a)*s*.3;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(s*.07)+'" ry="'+(s*.22)+'" fill="#f8e840" opacity=".85" transform="rotate('+(i*15)+' '+h+' '+v+')"/>';}
    for(var i=0;i<16;i++){var a=i/16*Math.PI*2,px=h+Math.cos(a)*s*.18,py=v+Math.sin(a)*s*.18;o+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(s*.06)+'" ry="'+(s*.14)+'" fill="#f8d020" opacity=".9" transform="rotate('+(i*22.5)+' '+h+' '+v+')"/>';}
    o+='<circle cx="'+h+'" cy="'+v+'" r="'+(s*.08)+'" fill="#e8c010"/>';
  } else if(type==='narcissus'){
    // 水仙：白い花びら＋黄色い副花冠

// ========== 節気取得 ==========
function getSekki(){
  var d=new Date(),m=d.getMonth()+1,day=d.getDate(),cur=sekki[0];
  for(var i=0;i<sekki.length;i++){if(m>sekki[i].m||(m===sekki[i].m&&day>=sekki[i].d))cur=sekki[i];}
  return cur;
}

// ========== 季節重み付き抽選 ==========
function weightedPick(sk){
  // 節気リストの花 + 通年花のみに絞る
  var pool=flowers.filter(function(f){
    return f.yearround || sk.flowers_list.indexOf(f.type)>=0;
  });
  // 節気リストの花は2倍出やすく
  var w=pool.map(function(f){return sk.flowers_list.indexOf(f.type)>=0?2:1;});
  var t=w.reduce(function(a,b){return a+b;},0),r=Math.random()*t,acc=0;
  for(var i=0;i<pool.length;i++){acc+=w[i];if(r<acc)return pool[i];}
  return pool[0];
}

// ========== 描画・インタラクション ==========
var drawn=false,cur=null,curSekki=null;

document.getElementById('flowerG').innerHTML=defaultFlower();

function draw(){
  if(drawn)return;
  var stage=document.getElementById('flowerStage');
  var svg=document.getElementById('mainSvg');
  stage.classList.remove('idle');
  svg.style.transition='transform 0.15s ease';
  svg.style.transform='scale(0.65)';
  setTimeout(function(){
    var sk=getSekki();
    cur=weightedPick(sk);
    curSekki=sk;
    document.getElementById('flowerG').innerHTML=flowerSVG(cur.type,80,80,58);
    svg.style.transform='';svg.style.transition='';
    stage.classList.add('blooming');
    setTimeout(function(){
      document.getElementById('hint').style.display='none';
      document.getElementById('rSvgSmall').innerHTML=flowerSVG(cur.type,22,22,18);
      document.getElementById('rFlower').textContent=cur.flower;
      document.getElementById('rEn').textContent=cur.en;
      var b=document.getElementById('rBadge');
      b.textContent=cur.luck;b.className='luck-badge '+cur.cls;
      // 節気のメッセージ＋花固有アドバイス
      document.getElementById('rMsg').textContent=sk.msg_season+' '+cur.msg;
      document.getElementById('rAdvice').textContent=cur.advice+' '+sk.advice_season;
      document.getElementById('rPretty').textContent=sk.pretty_season;
      document.getElementById('giftCard').style.display=cur.cls==='daikichi'?'block':'none';
      document.getElementById('result').className='result show';
      drawn=true;
    },520);
  },150);
}

function reset(){
  drawn=false;cur=null;
  var stage=document.getElementById('flowerStage');
  stage.classList.remove('blooming');stage.classList.add('idle');
  document.getElementById('flowerG').innerHTML=defaultFlower();
  document.getElementById('hint').style.display='block';
  document.getElementById('result').className='result';
  document.getElementById('giftCard').style.display='none';
}

function copyResult(){
  if(!cur||!curSekki)return;
  var d=new Date();
  var txt='🌿 今日の花おみくじ\n'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+curSekki.name+'の頃）\n\nお花：'+cur.flower+'\n運勢：'+cur.luck+'\n\n'+curSekki.msg_season+'\n'+cur.msg+'\n\n'+cur.advice+'\n\n✦ pretty flower ✦\nhttps://pretty-flower.github.io/shop/';
  navigator.clipboard.writeText(txt).then(function(){
    var b=document.getElementById('copyBtn');
    b.textContent='コピーしました ✓';
    setTimeout(function(){b.textContent='結果をコピー';},2000);
  });
}
